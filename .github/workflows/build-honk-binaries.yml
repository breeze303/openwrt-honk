name: Build Honk binaries

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - .github/scripts/build-honk-binaries.sh
      - .github/workflows/build-honk-binaries.yml
      - honk/Makefile
      - honk/source.mk
      - honk/patches/**
      - locks/source.lock.json
      - locks/toolchains.lock.json

permissions:
  contents: read

concurrency:
  group: honk-binaries-${{ github.ref }}
  cancel-in-progress: true

env:
  BPF_LINKER_VERSION: 0.10.4
  BPF_LINKER_SHA256: 4dda77daab6c5f120a468e6d3ede2498f5bd47ece712172cfb7290176d93d015
  BPF_RUST_TOOLCHAIN: nightly-2026-07-27
  RUST_STABLE_TOOLCHAIN: 1.97.1

jobs:
  prepare:
    name: Prepare version
    runs-on: ubuntu-24.04
    outputs:
      release_name: ${{ steps.meta.outputs.release_name }}
      release_tag: ${{ steps.meta.outputs.release_tag }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Generate version metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          pkg_version=$(sed -n 's/^PKG_VERSION:=//p' honk/Makefile | head -n 1)
          pkg_release=$(sed -n 's/^PKG_RELEASE:=//p' honk/Makefile | head -n 1)
          source_revision=$(sed -n 's/^PKG_SOURCE_VERSION:=//p' honk/source.mk | head -n 1)
          short_revision=${source_revision:0:7}
          version="${pkg_version}-r${pkg_release}_${short_revision}"
          release="honk_binaries_${version}"
          {
            echo "version=$version"
            echo "release_name=$release"
            echo "release_tag=$release"
          } >>"$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.package_arch }} static binary
    needs: prepare
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - package_arch: x86_64
            rust_target: x86_64-unknown-linux-musl
          - package_arch: aarch64
            rust_target: aarch64-unknown-linux-musl

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Install system dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang llvm libbpf-dev pkg-config cmake libclang-dev zstd

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1

      - name: Download eBPF linker
        shell: bash
        run: |
          set -euo pipefail
          archive=$(mktemp)
          url="https://github.com/aya-rs/bpf-linker/releases/download/v${BPF_LINKER_VERSION}/bpf-linker-x86_64-unknown-linux-musl.tar.zst"
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 2 --output "$archive" "$url"
          echo "${BPF_LINKER_SHA256}  ${archive}" | sha256sum -c -
          mkdir -p "$HOME/.cargo/bin"
          tar --zstd -xf "$archive" -C "$HOME/.cargo/bin"
          bpf-linker --version

      - name: Cache Cargo downloads
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: honk-cargo-${{ runner.os }}-${{ matrix.rust_target }}-${{ hashFiles('honk/source.mk', 'honk/patches/*.patch', 'locks/toolchains.lock.json') }}

      - name: Build static Honk binaries
        shell: bash
        env:
          ARTIFACTS_DIR: ${{ github.workspace }}/.binary-output
          PACKAGE_ARCH: ${{ matrix.package_arch }}
          RUST_TARGET: ${{ matrix.rust_target }}
        run: bash .github/scripts/build-honk-binaries.sh

      - name: Package binaries
        shell: bash
        env:
          ARCH: ${{ matrix.package_arch }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          test -x .binary-output/honk-core
          test -x .binary-output/honk-tool
          mkdir -p dist/stage
          install -m 0755 .binary-output/honk-core dist/stage/honk-core
          install -m 0755 .binary-output/honk-tool dist/stage/honk-tool
          install -m 0644 .binary-output/build-manifest.json dist/stage/manifest.json
          jq --arg version "$VERSION" --arg commit "$GITHUB_SHA" \
            '. + {version:$version, repositoryCommit:$commit}' \
            dist/stage/manifest.json >dist/stage/manifest.tmp
          mv dist/stage/manifest.tmp dist/stage/manifest.json
          (cd dist/stage && sha256sum honk-core honk-tool >SHA256SUMS)
          archive="honk-${VERSION}-${ARCH}.tar.gz"
          tar -C dist/stage -czf "dist/$archive" .
          (cd dist && sha256sum "$archive" >"$archive.sha256")
          ls -lh dist/*.tar.gz dist/*.sha256

      - name: Upload binary artifacts
        uses: actions/upload-artifact@v7
        with:
          name: honk-binaries-${{ matrix.package_arch }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish binary release
    needs:
      - prepare
      - build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download all binary artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Create or update binary release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.release_tag }}
          name: ${{ needs.prepare.outputs.release_name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: release-assets/*
