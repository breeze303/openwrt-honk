name: Build Honk binaries

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - .github/scripts/build-honk-binaries-in-sdk.sh
      - .github/workflows/build-honk-binaries.yml
      - honk/Makefile
      - honk/source.mk
      - honk/patches/**

permissions:
  contents: read

concurrency:
  group: honk-binaries-${{ github.ref }}
  cancel-in-progress: true

env:
  BPF_LINKER_VERSION: 0.10.4
  BPF_LINKER_SHA256: 4dda77daab6c5f120a468e6d3ede2498f5bd47ece712172cfb7290176d93d015
  BPF_RUST_TOOLCHAIN: nightly-2026-07-27

jobs:
  prepare:
    name: Prepare version
    runs-on: ubuntu-24.04
    outputs:
      release_name: ${{ steps.meta.outputs.release_name }}
      release_tag: ${{ steps.meta.outputs.release_tag }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Generate version metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          pkg_version=$(sed -n 's/^PKG_VERSION:=//p' honk/Makefile | head -n 1)
          pkg_release=$(sed -n 's/^PKG_RELEASE:=//p' honk/Makefile | head -n 1)
          source_revision=$(sed -n 's/^PKG_SOURCE_VERSION:=//p' honk/source.mk | head -n 1)
          short_revision=${source_revision:0:7}
          version="${pkg_version}-r${pkg_release}_${short_revision}"
          release="honk_binaries_${version}"
          {
            echo "version=$version"
            echo "release_name=$release"
            echo "release_tag=$release"
          } >>"$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.arch }} / ${{ matrix.sdk }}
    needs: prepare
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            sdk: openwrt-24.10
            rust_target: x86_64-unknown-linux-musl
          - arch: aarch64_generic
            sdk: openwrt-24.10
            rust_target: aarch64-unknown-linux-musl
          - arch: x86_64
            sdk: openwrt-25.12
            rust_target: x86_64-unknown-linux-musl
          - arch: aarch64_generic
            sdk: openwrt-25.12
            rust_target: aarch64-unknown-linux-musl

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Download eBPF linker
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y zstd
          archive=$(mktemp)
          url="https://github.com/aya-rs/bpf-linker/releases/download/v${BPF_LINKER_VERSION}/bpf-linker-x86_64-unknown-linux-musl.tar.zst"
          curl --fail --location --retry 3 --output "$archive" "$url"
          echo "${BPF_LINKER_SHA256}  ${archive}" | sha256sum -c -
          mkdir -p .ci-tools
          tar --zstd -xf "$archive" -C .ci-tools
          test -x .ci-tools/bpf-linker

      - name: Build Honk in OpenWrt SDK
        shell: bash
        env:
          RUST_TARGET: ${{ matrix.rust_target }}
          SDK_IMAGE: ghcr.io/openwrt/sdk:${{ matrix.arch }}-${{ matrix.sdk }}
        run: |
          set -euo pipefail
          mkdir -p .binary-output
          sudo chown 1000:1000 .binary-output
          docker run --rm \
            --user root \
            --env BPF_RUST_TOOLCHAIN \
            --env RUST_TARGET \
            --volume "$GITHUB_WORKSPACE:/feed:ro" \
            --volume "$GITHUB_WORKSPACE/.binary-output:/artifacts" \
            "$SDK_IMAGE" \
            bash -lc '
              set -euo pipefail
              apt-get update
              apt-get install -y --no-install-recommends libclang-dev
              exec runuser --user buildbot -- \
                env BPF_RUST_TOOLCHAIN="$BPF_RUST_TOOLCHAIN" \
                    RUST_TARGET="$RUST_TARGET" \
                bash /feed/.github/scripts/build-honk-binaries-in-sdk.sh
            '
          sudo chown -R "$(id -u):$(id -g)" .binary-output

      - name: Package binaries
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
          SDK: ${{ matrix.sdk }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          test -x .binary-output/honk-core
          test -x .binary-output/honk-tool
          mkdir -p dist/stage
          install -m 0755 .binary-output/honk-core dist/stage/honk-core
          install -m 0755 .binary-output/honk-tool dist/stage/honk-tool
          sha256sum dist/stage/honk-core dist/stage/honk-tool \
            | sed 's#dist/stage/##' >dist/stage/SHA256SUMS
          jq -n \
            --arg version "$VERSION" \
            --arg arch "$ARCH" \
            --arg sdk "$SDK" \
            --arg commit "$GITHUB_SHA" \
            '{version:$version, architecture:$arch, sdk:$sdk, repositoryCommit:$commit}' \
            >dist/stage/manifest.json
          archive="honk-${VERSION}-${ARCH}-${SDK}.tar.gz"
          tar -C dist/stage -czf "dist/$archive" .
          (cd dist && sha256sum "$archive" >"$archive.sha256")
          ls -lh dist/*.tar.gz dist/*.sha256

      - name: Upload binary artifacts
        uses: actions/upload-artifact@v7
        with:
          name: honk-binaries-${{ matrix.arch }}-${{ matrix.sdk }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish binary release
    needs:
      - prepare
      - build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download all binary artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Create or update binary release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.release_tag }}
          name: ${{ needs.prepare.outputs.release_name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: release-assets/*
