name: Update Honk upstream

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-honk-upstream
  cancel-in-progress: false

jobs:
  update:
    name: Check upstream main
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout packaging repository
        uses: actions/checkout@v6

      - name: Install validation tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y jq patch lua5.4 ripgrep clang llvm libclang-dev pkg-config cmake

      - name: Update immutable source lock
        id: source
        shell: bash
        run: bash .github/scripts/update-honk-source.sh --ref refs/heads/main

      - name: Validate updated source and patches
        if: steps.source.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 --profile minimal
          source_commit=$(jq -er '.source.commit' locks/source.lock.json)
          bash .github/scripts/verify-source-lock.sh \
            --commit "$source_commit" \
            --check-tree \
            --check-archive \
            --check-mirror-hash \
            --receipt-dir "$RUNNER_TEMP/source-lock-receipt"
          HONK_TEST_RUST_TOOLCHAIN=1.97.1 bash tests/run-tests.sh
          git diff --check

      - name: Create or update source refresh PR
        if: steps.source.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_COMMIT: ${{ steps.source.outputs.new_commit }}
          OLD_COMMIT: ${{ steps.source.outputs.old_commit }}
        run: |
          set -euo pipefail
          branch=automation/honk-upstream
          short_commit=${NEW_COMMIT:0:7}
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git switch -C "$branch"
          git add locks/source.lock.json honk/source.mk
          git commit -m "chore: update Honk upstream to $short_commit"
          git push --force origin "HEAD:$branch"

          pull_url=$(gh pr list --base main --head "$branch" --state open --json url --jq '.[0].url // ""')
          if [ -z "$pull_url" ]; then
            gh pr create \
              --base main \
              --head "$branch" \
              --title "chore: update Honk upstream to $short_commit" \
              --body "Updates Honk upstream from \`$OLD_COMMIT\` to \`$NEW_COMMIT\`.\n\nThe source archive, SHA-256, Git tree and local patch series were validated before this PR was created. After merge, the OpenWrt package workflow builds Honk from source in the SDK matrix."
          else
            gh pr edit "$pull_url" \
              --title "chore: update Honk upstream to $short_commit" \
              --body "Updates Honk upstream from \`$OLD_COMMIT\` to \`$NEW_COMMIT\`.\n\nThe source archive, SHA-256, Git tree and local patch series were validated before this PR was updated. After merge, the OpenWrt package workflow builds Honk from source in the SDK matrix."
          fi
