name: Build packages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/scripts/build-packages-in-sdk.sh
      - .github/workflows/build-packages.yml
      - honk/**
      - locks/**
      - luci-app-honk/**
      - luci-app-honk-legacy/**
  pull_request:
    branches:
      - main
    paths:
      - .github/scripts/build-packages-in-sdk.sh
      - .github/workflows/build-packages.yml
      - honk/**
      - locks/**
      - luci-app-honk/**
      - luci-app-honk-legacy/**

permissions:
  contents: read

concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Prepare version
    runs-on: ubuntu-24.04
    outputs:
      checkout_ref: ${{ steps.meta.outputs.checkout_ref }}
      release_name: ${{ steps.meta.outputs.release_name }}
      release_tag: ${{ steps.meta.outputs.release_tag }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Generate version metadata
        id: meta
        shell: bash
        env:
          CHECKOUT_REF: ${{ github.sha }}
        run: |
          set -euo pipefail
          pkg_version=$(sed -n 's/^PKG_VERSION:=//p' honk/Makefile | head -n 1)
          pkg_release=$(sed -n 's/^PKG_RELEASE:=//p' honk/Makefile | head -n 1)
          source_revision=$(sed -n 's/^PKG_SOURCE_VERSION:=//p' honk/source.mk | head -n 1)
          short_revision=${source_revision:0:7}
          version="${pkg_version}-r${pkg_release}_${short_revision}"
          {
            echo "checkout_ref=$CHECKOUT_REF"
            echo "release_name=honk_${version}"
            echo "release_tag=honk_${version}"
            echo "version=$version"
          } >>"$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.arch }} / ${{ matrix.sdk }}
    needs: prepare
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            sdk: openwrt-24.10
            package_ext: ipk
          - arch: aarch64_generic
            sdk: openwrt-24.10
            package_ext: ipk
          - arch: x86_64
            sdk: openwrt-25.12
            package_ext: apk
          - arch: aarch64_generic
            sdk: openwrt-25.12
            package_ext: apk

    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}

      - name: Prepare locked Geo assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cache/dl
          curl --proto '=https' --tlsv1.2 --fail --location --retry 5 --retry-all-errors \
            --output .cache/dl/loyalsoldier-geosite-202607312254.dat \
            https://github.com/Loyalsoldier/v2ray-rules-dat/releases/download/202607312254/geosite.dat
          curl --proto '=https' --tlsv1.2 --fail --location --retry 5 --retry-all-errors \
            --output .cache/dl/v2fly-geoip-202607171233.dat \
            https://github.com/v2fly/geoip/releases/download/202607171233/geoip.dat
          printf '%s  %s\n' \
            1f3a743e8e30152a870a1674792af3976361436dcb1f510a43c499d430f6b13f \
            .cache/dl/loyalsoldier-geosite-202607312254.dat | sha256sum -c -
          printf '%s  %s\n' \
            b71d1999439dde2de2d2b6844a2befa50c50211ff739785c005ca7c230a17d6a \
            .cache/dl/v2fly-geoip-202607171233.dat | sha256sum -c -

      - name: Build packages in OpenWrt SDK
        shell: bash
        env:
          SDK_IMAGE: ghcr.io/openwrt/sdk:${{ matrix.arch }}-${{ matrix.sdk }}
          BPF_LINKER_SHA256: 4dda77daab6c5f120a468e6d3ede2498f5bd47ece712172cfb7290176d93d015
          BPF_LINKER_VERSION: 0.10.4
          BPF_RUST_TOOLCHAIN: nightly-2026-07-27
          RUST_FEED_COMMIT: 2006dff59caa09bc3bc22ffdc84df2aa1c8d0c8a
        run: |
          set -euo pipefail
          mkdir -p .build-output
          sudo chown 1000:1000 .build-output .cache/dl
          docker run --rm \
            --user root \
            --env BPF_LINKER_SHA256 \
            --env BPF_LINKER_VERSION \
            --env BPF_RUST_TOOLCHAIN \
            --env RUST_FEED_COMMIT \
            --volume "$GITHUB_WORKSPACE:/feed:ro" \
            --volume "$GITHUB_WORKSPACE/.build-output:/artifacts" \
            "$SDK_IMAGE" \
            bash -lc '
              set -euo pipefail
              apt-get update
              apt-get install -y --no-install-recommends ca-certificates curl git zstd libclang-dev clang llvm libbpf-dev pkg-config cmake
              exec runuser --user buildbot -- \
                env BPF_LINKER_SHA256="$BPF_LINKER_SHA256" \
                    BPF_LINKER_VERSION="$BPF_LINKER_VERSION" \
                    BPF_RUST_TOOLCHAIN="$BPF_RUST_TOOLCHAIN" \
                    RUST_FEED_COMMIT="$RUST_FEED_COMMIT" \
                    bash /feed/.github/scripts/build-packages-in-sdk.sh
            '
          sudo chown -R "$(id -u):$(id -g)" .build-output

      - name: Prepare artifacts
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
          PACKAGE_EXT: ${{ matrix.package_ext }}
          SDK: ${{ matrix.sdk }}
        run: |
          set -euo pipefail
          package_dir=".build-output/bin/packages/${ARCH}/honk_ci"
          mkdir -p dist
          shopt -s nullglob
          packages=(
            "$package_dir"/honk[-_]*."$PACKAGE_EXT"
            "$package_dir"/luci-app-honk[-_]*."$PACKAGE_EXT"
          )
          if [ "${#packages[@]}" -ne 3 ]; then
            echo "Expected honk, luci-app-honk, and luci-app-honk-legacy packages in $package_dir" >&2
            find .build-output/bin/packages -type f -print || true
            exit 1
          fi
          for package in "${packages[@]}"; do
            base=$(basename "$package" ".$PACKAGE_EXT")
            cp "$package" "dist/${base}-${ARCH}-${SDK}.${PACKAGE_EXT}"
          done
          ls -lah dist

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: honk-${{ matrix.arch }}-${{ matrix.sdk }}-${{ matrix.package_ext }}
          path: dist/*.${{ matrix.package_ext }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish release
    if: github.event_name != 'pull_request'
    needs:
      - prepare
      - build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Create or update GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.release_tag }}
          name: ${{ needs.prepare.outputs.release_name }}
          target_commitish: ${{ needs.prepare.outputs.checkout_ref }}
          generate_release_notes: true
          files: release-assets/*
