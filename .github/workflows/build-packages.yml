name: Build packages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/scripts/build-packages-in-sdk.sh
      - .github/workflows/build-packages.yml
      - honk/**
      - locks/**
      - luci-app-honk/**
      - luci-app-honk-legacy/**
  pull_request:
    branches:
      - main
    paths:
      - .github/scripts/build-packages-in-sdk.sh
      - .github/workflows/build-packages.yml
      - honk/**
      - locks/**
      - luci-app-honk/**
      - luci-app-honk-legacy/**

permissions:
  contents: read

concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Prepare version
    runs-on: ubuntu-24.04
    outputs:
      checkout_ref: ${{ steps.meta.outputs.checkout_ref }}
      release_name: ${{ steps.meta.outputs.release_name }}
      release_tag: ${{ steps.meta.outputs.release_tag }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Generate version metadata
        id: meta
        shell: bash
        env:
          CHECKOUT_REF: ${{ github.sha }}
        run: |
          set -euo pipefail
          pkg_version=$(sed -n 's/^PKG_VERSION:=//p' honk/Makefile | head -n 1)
          pkg_release=$(sed -n 's/^PKG_RELEASE:=//p' honk/Makefile | head -n 1)
          source_revision=$(sed -n 's/^PKG_SOURCE_VERSION:=//p' honk/source.mk | head -n 1)
          short_revision=${source_revision:0:7}
          version="${pkg_version}-r${pkg_release}_${short_revision}"
          {
            echo "checkout_ref=$CHECKOUT_REF"
            echo "release_name=honk_${version}"
            echo "release_tag=honk_${version}"
            echo "version=$version"
          } >>"$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.arch }} / ${{ matrix.sdk }}
    needs: prepare
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            sdk: openwrt-24.10
            package_ext: ipk
          - arch: aarch64_generic
            sdk: openwrt-24.10
            package_ext: ipk
          - arch: x86_64
            sdk: openwrt-25.12
            package_ext: apk
          - arch: aarch64_generic
            sdk: openwrt-25.12
            package_ext: apk

    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}

      - name: Resolve SDK cache identity
        id: sdk-cache-key
        shell: bash
        env:
          SDK_IMAGE: ghcr.io/openwrt/sdk:${{ matrix.arch }}-${{ matrix.sdk }}
        run: |
          set -euo pipefail
          docker pull "$SDK_IMAGE"
          image_id=$(docker image inspect --format '{{.Id}}' "$SDK_IMAGE")
          script_hash=$(sha256sum \
            .github/workflows/build-packages.yml \
            .github/scripts/build-packages-in-sdk.sh \
            locks/toolchains.lock.json | sha256sum | cut -d ' ' -f 1)
          cache_identity=$(printf '%s\n%s\n%s\n%s\n%s\n' \
            "$image_id" \
            "${{ matrix.arch }}" \
            "${{ matrix.sdk }}" \
            "$script_hash" \
            "toolchain-cache-v1" | sha256sum | cut -d ' ' -f 1)
          shared_cache_identity=$(printf '%s\n%s\n' \
            "$script_hash" \
            "shared-rust-bpf-cache-v1" | sha256sum | cut -d ' ' -f 1)
          {
            echo "image_id=$image_id"
            echo "cache_identity=$cache_identity"
            echo "shared_cache_identity=$shared_cache_identity"
          } >>"$GITHUB_OUTPUT"

      - name: Restore shared Rust and BPF cache
        id: shared-tool-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            .ci-cache/openwrt/cargo
            .ci-cache/openwrt/rustup
            .ci-cache/openwrt/rust-feed
            .ci-cache/openwrt/tool-downloads
          key: honk-rust-bpf-v1-${{ runner.os }}-${{ steps.sdk-cache-key.outputs.shared_cache_identity }}

      - name: Restore SDK toolchain cache
        id: sdk-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            .ci-cache/openwrt/dl
            .ci-cache/openwrt/sccache
            .ci-cache/openwrt/rust-host
          key: honk-sdk-toolchain-v1-${{ runner.os }}-${{ matrix.arch }}-${{ matrix.sdk }}-${{ steps.sdk-cache-key.outputs.cache_identity }}

      - name: Build packages in OpenWrt SDK
        shell: bash
        env:
          SDK_IMAGE: ghcr.io/openwrt/sdk:${{ matrix.arch }}-${{ matrix.sdk }}
          BPF_LINKER_SHA256: 4dda77daab6c5f120a468e6d3ede2498f5bd47ece712172cfb7290176d93d015
          BPF_LINKER_VERSION: 0.10.4
          BPF_RUST_TOOLCHAIN: nightly-2026-07-20
          RUST_FEED_COMMIT: 2006dff59caa09bc3bc22ffdc84df2aa1c8d0c8a
          SCCACHE_VERSION: 0.17.0
          SCCACHE_SHA256: 67c4a96dd237c1f518f6b36083f270f9976d516f1e57fce891755ea782e50006
        run: |
          set -euo pipefail
          mkdir -p .build-output .ci-cache/openwrt
          sudo chown -R 1000:1000 .build-output .ci-cache/openwrt .cache/dl
          docker run --rm \
            --user root \
            --env BPF_LINKER_SHA256 \
            --env BPF_LINKER_VERSION \
            --env BPF_RUST_TOOLCHAIN \
            --env RUST_FEED_COMMIT \
            --env SCCACHE_VERSION \
            --env SCCACHE_SHA256 \
            --env SDK_CACHE_DIR=/cache \
            --env SCCACHE_CACHE_SIZE=768M \
            --volume "$GITHUB_WORKSPACE:/feed:ro" \
            --volume "$GITHUB_WORKSPACE/.build-output:/artifacts" \
            --volume "$GITHUB_WORKSPACE/.ci-cache/openwrt:/cache" \
            "$SDK_IMAGE" \
            bash -lc '
              set -euo pipefail
              apt-get update
              apt-get install -y --no-install-recommends ca-certificates curl git zstd libclang-dev clang llvm libbpf-dev pkg-config cmake
              mkdir -p /cache
              chown -R buildbot:buildbot /cache /artifacts
              exec runuser --user buildbot -- \
                env BPF_LINKER_SHA256="$BPF_LINKER_SHA256" \
                    BPF_LINKER_VERSION="$BPF_LINKER_VERSION" \
                    BPF_RUST_TOOLCHAIN="$BPF_RUST_TOOLCHAIN" \
                    RUST_FEED_COMMIT="$RUST_FEED_COMMIT" \
                    SCCACHE_VERSION="$SCCACHE_VERSION" \
                    SCCACHE_SHA256="$SCCACHE_SHA256" \
                    SDK_CACHE_DIR="$SDK_CACHE_DIR" \
                    SCCACHE_CACHE_SIZE="$SCCACHE_CACHE_SIZE" \
                    bash /feed/.github/scripts/build-packages-in-sdk.sh
            '
          sudo chown -R "$(id -u):$(id -g)" .build-output .ci-cache/openwrt

      - name: Prepare artifacts
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
          PACKAGE_EXT: ${{ matrix.package_ext }}
          SDK: ${{ matrix.sdk }}
        run: |
          set -euo pipefail
          package_dir=".build-output/bin/packages/${ARCH}/honk_ci"
          mkdir -p dist
          shopt -s nullglob
          packages=(
            "$package_dir"/honk[-_]*."$PACKAGE_EXT"
            "$package_dir"/luci-app-honk[-_]*."$PACKAGE_EXT"
          )
          if [ "${#packages[@]}" -ne 3 ]; then
            echo "Expected honk, luci-app-honk, and luci-app-honk-legacy packages in $package_dir" >&2
            find .build-output/bin/packages -type f -print || true
            exit 1
          fi
          for package in "${packages[@]}"; do
            base=$(basename "$package" ".$PACKAGE_EXT")
            cp "$package" "dist/${base}-${ARCH}-${SDK}.${PACKAGE_EXT}"
          done
          ls -lah dist

      - name: Save SDK toolchain cache
        if: success() && github.event_name != 'pull_request' && steps.sdk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            .ci-cache/openwrt/dl
            .ci-cache/openwrt/sccache
            .ci-cache/openwrt/rust-host
          key: honk-sdk-toolchain-v1-${{ runner.os }}-${{ matrix.arch }}-${{ matrix.sdk }}-${{ steps.sdk-cache-key.outputs.cache_identity }}

      - name: Save shared Rust and BPF cache
        if: success() && github.event_name != 'pull_request' && matrix.arch == 'x86_64' && matrix.sdk == 'openwrt-25.12' && steps.shared-tool-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            .ci-cache/openwrt/cargo
            .ci-cache/openwrt/rustup
            .ci-cache/openwrt/rust-feed
            .ci-cache/openwrt/tool-downloads
          key: honk-rust-bpf-v1-${{ runner.os }}-${{ steps.sdk-cache-key.outputs.shared_cache_identity }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: honk-${{ matrix.arch }}-${{ matrix.sdk }}-${{ matrix.package_ext }}
          path: dist/*.${{ matrix.package_ext }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish release
    if: github.event_name != 'pull_request'
    needs:
      - prepare
      - build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Create or update GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.release_tag }}
          name: ${{ needs.prepare.outputs.release_name }}
          target_commitish: ${{ needs.prepare.outputs.checkout_ref }}
          generate_release_notes: true
          files: release-assets/*
